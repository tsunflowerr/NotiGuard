name: Android checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/notiguard-android-sdk"
          archive="$RUNNER_TEMP/notiguard-commandline-tools.zip"
          # Official download and SHA256: https://developer.android.com/studio#command-tools
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip' -o "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/notiguard-sdk-license-answers"
          "$manager" --sdk_root="$sdk_root" --licenses < "$RUNNER_TEMP/notiguard-sdk-license-answers" > /dev/null
          "$manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and unsigned release build
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
